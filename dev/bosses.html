header h1{margin:0;font:600 20px Oswald,Arial,sans-serif;letter-spacing:.5px}
header label{display:flex;align-items:center;gap:6px;color:#b8b39f}
select,button{font:inherit;color:#e8e0c8;background:#262a2f;border:1px solid #ffffff22;border-radius:4px;padding:5px 8px}
button{cursor:pointer}.status{color:#a9a48f;margin-left:auto}
.rows{display:grid;gap:14px;padding:14px 18px}
.row{background:#1d2024;border:1px solid #ffffff12;border-left:4px solid var(--tier,#666);border-radius:6px;overflow:hidden}
.row.boss{border-left-width:10px;background:#212529}
.head{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;padding:8px 12px}
.head h3{margin:0;font:600 17px Oswald,Arial,sans-serif}
.head .role{color:#a9a48f}.head .где{color:#7f8a93;margin-left:auto;font-size:12px}
.views{display:grid;grid-template-columns:2fr 1fr;gap:2px;background:#000}
.views canvas{display:block;width:100%;background:#2a2e33}
.spec{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px}
.spec b{font-weight:400;background:#2a2f35;border:1px solid #ffffff14;border-radius:3px;padding:2px 7px;color:#d9d2bb}
.spec b.neon{border-color:var(--neon,#888);color:var(--neon,#ddd)}
.spec b.tier{background:var(--tier,#555);color:#12151a;font-weight:700}
</style></head><body>
<header><h1>Боссы и главари · тачки</h1>
<label>Показать <select id="who"><option value="bosses">только боссы районов</option><option value="named">именные</option><option value="all">все 45 главарей</option></select></label>
<button id="redraw">Перерисовать</button><span class="status" id="status">…</span></header>
<div class="rows" id="rows"></div>
<script type="module">
import * as T from 'three';
import {createGLTFLoader} from '../gltf.js';
import {CARS} from '../fleet.js';
import {PAINTS} from '../paints.js';
import {NEONS} from '../neons.js';
import {hydrate,opponent,CHARACTER_LOOKS} from '../progression.js';
import {campaignPosition,CAMPAIGN_LENGTH} from '../campaign-config.js';
import {isOverpassStage} from '../overpass-flow.js';
import {characterFor} from '../characters.js';
import {applyCustomization} from '../car-customization.js';
import {attachNeon} from '../car-neon.js';
import {pbrMaterial,outdoorEnvironment} from '../pbr-renderer.js';

const $=s=>document.querySelector(s),q=new URLSearchParams(location.search);
const rows=$('#rows'),status=$('#status'),whoSel=$('#who');
whoSel.value=q.get('who')||'bosses';
const paintName=id=>PAINTS.find(p=>p.id===id)?.name||id;
const neonOf=id=>NEONS.find(n=>n.id===id);
const TIER_COLOR=['#666','#8a8f96','#4f9fd6','#a06ad6','#d68a3a','#d64f4f'];

const W=760,SIDE_H=300,Q_W=380;
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true,alpha:true});
renderer.setPixelRatio(1);renderer.setSize(W,SIDE_H,false);renderer.outputColorSpace=T.SRGBColorSpace;
renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;
const env=outdoorEnvironment(renderer,{sky:0x9fb4c8,fog:0xd8d3c4,sun:0xfff0d0,intensity:1,id:'bosses'});
const scene=new T.Scene();scene.background=new T.Color(0x22262b);scene.environment=env.texture;scene.environmentIntensity=.9;
scene.add(new T.HemisphereLight(0xe8eef6,0x4a453b,1.5));
const key=new T.DirectionalLight(0xfff0d8,3.1);key.position.set(-4,7,6);scene.add(key);
const rim=new T.DirectionalLight(0xb8d0ee,1.3);rim.position.set(5,3,-5);scene.add(rim);
const ground=new T.Mesh(new T.CircleGeometry(6,48),new T.MeshStandardMaterial({color:0x33383e,roughness:.9}));
ground.rotation.x=-Math.PI/2;scene.add(ground);

const models=new Map();
async function base(i){
 if(models.has(i))return models.get(i);
 const gltf=await createGLTFLoader().loadAsync(`../assets/cars/${CARS[i].id}.glb`);
 const car=gltf.scene;car.userData.fit=CARS[i];
 car.traverse(o=>{if(o.isMesh)o.material=pbrMaterial(o.material,CARS[i]);});
 models.set(i,car);return car;
}
function instance(i,rival){
 const root=new T.Group(),car=models.get(i).clone(true);root.add(car);
 Object.assign(root.userData,{carLength:CARS[i].length,carWidth:CARS[i].width,wheelbase:CARS[i].wheelbase,axleOffset:CARS[i].axleOffset||0,wheelRadius:CARS[i].radius,wheels:[]});
 applyCustomization(root,car,rival.equipment||{},rival.paint||CARS[i].color,rival.decal||null);
 if(rival.neon)attachNeon(root,rival.neon,{reduced:true,racing:false});
 return root;
}
const shoot=(cam,canvas)=>{renderer.setSize(canvas.width,canvas.height,false);renderer.render(scene,cam);canvas.getContext('2d').drawImage(renderer.domElement,0,0);};
function side(root,canvas,car){
 const L=root.userData.carLength,H=car.height||1.5,cw=canvas.width,ch=canvas.height;
 const cam=new T.OrthographicCamera(-L*.58,L*.58,L*.58*ch/cw,-L*.58*ch/cw,.1,50);
 cam.position.set(0,H*.5+.6,8);cam.lookAt(0,H*.5-.1,0);shoot(cam,canvas);
}
function quarter(root,canvas){
 const L=root.userData.carLength;
 const cam=new T.PerspectiveCamera(30,canvas.width/canvas.height,.1,60);
 cam.position.set(-L*1.05,1.3,L*.95);cam.lookAt(0,.5,0);shoot(cam,canvas);
}
// Кого показываем: боссы районов, все именные (у них своя внешность) или вся лестница главарей.
function list(){
 const mode=whoSel.value,out=[];
 for(let rank=0;rank<CAMPAIGN_LENGTH;rank++){
  if(isOverpassStage(rank))continue;
  const pos=campaignPosition(rank);if(!pos.boss&&!pos.captain)continue;
  const rival=opponent({...hydrate({version:3,campaignRevision:2}),rank});
  if(mode==='bosses'&&!pos.boss)continue;
  if(mode==='named'&&!CHARACTER_LOOKS[rival.name])continue;
  out.push({rank,pos,rival});
 }
 return out;
}
let busy=false;
async function draw(){
 if(busy)return;busy=true;rows.innerHTML='';
 const items=list();
 for(const [k,{rank,pos,rival}] of items.entries()){
  status.textContent=`рисуем ${k+1}/${items.length} · ${rival.name}`;
  await base(rival.car);
  const el=document.createElement('article');
  el.className='row'+(pos.boss?' boss':'');
  el.style.setProperty('--tier',TIER_COLOR[rival.tier]||'#666');
  const neon=neonOf(rival.neon),role=characterFor(rival.name)?.role||'';
  el.innerHTML=`<div class="head"><h3>${rival.name}</h3><span class="role">${role}</span>
   <span class="где">${pos.boss?'босс района':'главарь'} ${pos.map+1} · серия ${pos.series+1} · ранг ${rank}</span></div>
   <div class="views"><canvas width="${W}" height="${SIDE_H}"></canvas><canvas width="${Q_W}" height="${SIDE_H}"></canvas></div>
   <div class="spec"><b class="tier">ступень ${rival.tier}</b><b>${CARS[rival.car].name}</b><b>${paintName(rival.paint)}</b>
   ${rival.decal?`<b>винил: ${rival.decal}</b>`:''}
   ${neon?`<b class="neon" style="--neon:${neon.color}">неон: ${neon.name}</b>`:'<b>без неона</b>'}
   ${Object.values(rival.equipment||{}).map(id=>`<b>${id}</b>`).join('')||'<b>сток</b>'}</div>`;
  rows.append(el);
  await new Promise(x=>setTimeout(x,0));/* не rAF: в скрытой панели кадры не приходят */
  const root=instance(rival.car,rival);scene.add(root);
  const [a,b]=el.querySelectorAll('canvas');
  side(root,a,CARS[rival.car]);quarter(root,b);
  scene.remove(root);
 }
 status.textContent=`готово · ${items.length} соперников`;busy=false;
}
whoSel.onchange=draw;$('#redraw').onclick=draw;
draw();
</script></body></html>
