<style>
 :root{--bg:#141412;--card:#1e1f1b;--ink:#ece6d2;--muted:#9a978a;--unique:#e4463a}
 body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif;padding:16px}
 h1{font:600 22px/1.2 system-ui;margin:0 0 4px}p.lead{color:var(--muted);margin:0 0 16px;max-width:60ch}
 .car{margin:22px 0 8px;font:600 15px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
 .card{background:var(--card);border:1px solid #ffffff12;border-top:2px solid var(--unique);border-radius:6px;padding:10px}
 .card canvas{width:100%;height:auto;display:block;background:radial-gradient(circle at 50% 45%,#3a2a24,#1e1f1b 70%);border-radius:4px}
 .card b{display:block;margin-top:8px;font-size:15px}.card small{color:var(--unique);font-weight:600}
 .card p{margin:6px 0 0;color:var(--muted);font-size:13px}.card .stat{color:var(--ink);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<h1>Именные детали</h1>
<p class="lead">Уникальные технические части под конкретную машину: встают только на свою, проходят сквозь потолок кузова и дают лютый приток мощи. Добываются из красного ящика.</p>
<div id="out"></div>
<script type="module">
import * as T from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {SIGNATURE_PARTS} from '../signature-parts.js';
import {signatureModel} from '../signature-models.js';
import {CARS} from '../fleet.js';

const W=384,H=256;
const renderer=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(W,H);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.setClearColor(0,0);
const pmrem=new T.PMREMGenerator(renderer),env=pmrem.fromScene(new RoomEnvironment(),.04).texture;

// Ракурс и свет — как у обычных иконок деталей: три четверти сверху, мягкий ключ слева.
function frame(part){
 const scene=new T.Scene();scene.environment=env;
 scene.add(new T.HemisphereLight(0xf4ead4,0x2a2622,1.1));
 const key=new T.DirectionalLight(0xffe7c2,2.2);key.position.set(-2,3,3);scene.add(key);
 const rim=new T.DirectionalLight(0xff8a6a,1.1);rim.position.set(3,1.5,-2);scene.add(rim);
 const model=signatureModel(part.signature);scene.add(model);
 const box=new T.Box3().setFromObject(model),size=box.getSize(new T.Vector3()),center=box.getCenter(new T.Vector3());model.position.sub(center);
 const camera=new T.PerspectiveCamera(28,W/H,.05,20),dir=new T.Vector3(part.slot==='tires'?.55:1,.62,part.slot==='tires'?1.25:1.05).normalize();
 const radius=size.length()/2,dist=radius/Math.sin(T.MathUtils.degToRad(28)/2)*.62;
 camera.position.copy(dir.multiplyScalar(dist));camera.lookAt(0,0,0);
 return {scene,camera,model};
}
function draw(part,target){const {scene,camera,model}=frame(part);renderer.render(scene,camera);
 if(target){const ctx=target.getContext('2d');ctx.clearRect(0,0,W,H);ctx.drawImage(renderer.domElement,0,0);}
 model.traverse(o=>{if(o.isMesh){o.geometry.dispose();o.material.dispose();}});}

const out=document.querySelector('#out');
for(const car of [1,0,2,3]){
 const h=document.createElement('div');h.className='car';h.textContent=CARS[car].name;out.append(h);
 const grid=document.createElement('div');grid.className='grid';out.append(grid);
 for(const part of SIGNATURE_PARTS.filter(p=>p.car===car)){
  const card=document.createElement('div');card.className='card';const c=document.createElement('canvas');c.width=W;c.height=H;
  const extra=[part.gears?'+'+part.gears+' передач':'',part.accel?'тяга ×'+part.accel:''].filter(Boolean).join(' · ');
  card.append(c);card.insertAdjacentHTML('beforeend',`<b>${part.name}</b><small>Уникальная · только ${CARS[car].name}</small><p>${part.note}</p><div class="stat">мощь ×${part.power}${extra?' · '+extra:''}</div>`);
  grid.append(card);draw(part,c);
 }
}
// Для scripts/render-signature-icons.mjs: иконки на прозрачном фоне.
window.renderIcons=()=>SIGNATURE_PARTS.map(part=>{draw(part);return {key:part.signature,data:renderer.domElement.toDataURL('image/webp',.92)};});
window.ready=true;
</script>
</body>
</html>
