<style>body{margin:0;background:#101820;color:#eee;font:14px system-ui}canvas{display:block;width:100vw;height:100vh}header{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap}select,button{padding:10px;background:#17222bed;color:#eee;border:1px solid #66727d;border-radius:6px}output{position:fixed;bottom:12px;left:12px;right:12px;background:#17222bdf;padding:12px;border-radius:6px;font-size:12px;pointer-events:none}</style>
<header><select aria-label="Освещение" id="mode"><option value="day">День</option><option value="rain">Дождь</option><option value="night">Ночь</option></select><select aria-label="Краска" id="paint"><option value="cherry">Эмаль</option><option value="silver">Металлик</option><option value="black">Лак</option><option value="khaki">Матовая</option><option value="chameleon">Хамелеон</option></select><select aria-label="Качество" id="quality"><option value="0">Safe</option><option value="1" selected>Balanced</option><option value="2">High</option></select><button id="pause">Движение</button><button id="post">Постобработка: после</button></header><output id="status">Загрузка…</output>
<script type="module">
import * as T from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {createGLTFLoader} from '../gltf.js';
import {createRaceWorld} from '../race-world.js';
import {WeatherEffects} from '../weather-effects.js';
import {CARS} from '../fleet.js';
import {applyCustomization,disposeCustomizedCar} from '../car-customization.js';
import {GameRenderer,outdoorEnvironment,captureEnvironment,shadowBudget} from '../pbr-renderer.js';
import {QUALITY} from '../render-quality.js';
import {compositeFragment} from '../post-process.js';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);
$('mode').value=params.get('mode')||'day';$('paint').value=params.get('paint')||'cherry';
const renderer=new T.WebGLRenderer({antialias:false});renderer.info.autoReset=false;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const graphics=new GameRenderer(renderer),camera=new T.PerspectiveCamera(43,innerWidth/innerHeight,.1,300),controls=new OrbitControls(camera,renderer.domElement);
camera.position.set(-1,5.4,15);controls.target.set(0,.65,0);controls.update();controls.maxDistance=30;controls.minDistance=2;
let world,environment,probe,weather,models=[],cars=[],moving=false,busy=false,travel=0,last=0,frames=0;
let shaderErrors=0;renderer.debug.onShaderError=(gl,program,vs,fs)=>{shaderErrors++;console.error(gl.getProgramInfoLog(program),gl.getShaderInfoLog(vs),gl.getShaderInfoLog(fs));};
const meta=CARS[0],source=(await createGLTFLoader().loadAsync('/assets/race-cars/'+meta.id+'.glb')).scene;
const pixel=new T.DataTexture(new Uint8Array([255,255,255,255]),1,1);pixel.needsUpdate=true;
function resize(){const q=+$('quality').value;graphics.resize(innerWidth,innerHeight,devicePixelRatio,q,QUALITY[q]);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();world?.scene.traverse(o=>{if(o.isDirectionalLight&&o.castShadow)shadowBudget(o,QUALITY[q]);});weather?.setQuality(QUALITY[q]);}
async function build(){if(busy)return;busy=true;for(const id of ['mode','paint'])$(id).disabled=true;try{
 weather?.dispose();for(const root of models){root.removeFromParent();disposeCustomizedCar(root);}world?.dispose();environment?.dispose();probe?.dispose();
 models=[];cars=[];travel=0;const mode=$('mode').value;
 world=createRaceWorld(mode==='night'?4:mode==='rain'?2:0);environment=outdoorEnvironment(renderer,world.cfg);world.scene.environment=environment.texture;const bg=world.scene.background;world.scene.background=environment.texture;probe=captureEnvironment(renderer,world.scene,new T.Vector3(-1.9,1.1,-2));world.scene.background=bg;world.scene.environment=probe.texture;renderer.toneMappingExposure=mode==='night'?1.16:mode==='rain'?1.04:1;
 for(let i=0;i<2;i++){const car=source.clone(true),root=new T.Group();car.userData.fit=meta;Object.assign(root.userData,{racing:true,carLength:meta.length,carWidth:meta.width,wheelbase:meta.wheelbase,axleOffset:meta.axleOffset,wheelRadius:meta.radius});root.add(car);applyCustomization(root,car,{},i?'ivory':$('paint').value);root.rotation.y=-Math.PI/2;root.position.set(i?1.9:-1.9,0,i?-2:0);car.traverse(o=>{if(!o.isMesh)return;o.castShadow=o.receiveShadow=true;if(/headlight/i.test(o.material.name)){o.material.emissive.set(0xffdfaa);o.material.emissiveIntensity=world.cfg.night?2.2:.12;}});models.push(root);world.scene.add(root);cars.push({speed:0,travelDistance:0,time:0,gear:3,levels:[3,1,1],finished:false});}
 weather=new WeatherEffects(world.scene,{...world.cfg,storm:0},true,pixel);resize();weather.update(0,...cars,...models);await renderer.compileAsync(world.scene,camera);
 }finally{busy=false;for(const id of ['mode','paint'])$(id).disabled=false;}}
$('mode').onchange=()=>build().catch(fail);$('paint').onchange=()=>build().catch(fail);$('quality').onchange=resize;$('pause').onclick=()=>{moving=!moving;$('pause').textContent=moving?'Пауза':'Движение';};
// This A/B toggles only the composite. The scene/material improvements remain enabled.
const beforeFragment="uniform sampler2D source;uniform vec2 texel;uniform float glow;varying vec2 uv0;\nvec3 bright(vec2 p){vec3 c=texture2D(source,p).rgb;return c*max(0.,max(c.r,max(c.g,c.b))-1.15)/max(1.,max(c.r,max(c.g,c.b)));}\nvoid main(){vec3 c=texture2D(source,uv0).rgb;vec3 n=texture2D(source,uv0+vec2(0.,texel.y)).rgb,s=texture2D(source,uv0-vec2(0.,texel.y)).rgb,e=texture2D(source,uv0+vec2(texel.x,0.)).rgb,w=texture2D(source,uv0-vec2(texel.x,0.)).rgb;vec3 l=vec3(.2126,.7152,.0722);float contrast=max(abs(dot(n-s,l)),abs(dot(e-w,l)));c=mix(c,(n+s+e+w)*.25,clamp(contrast*.18,0.,.32));vec3 bloom=vec3(0.);vec2 d=texel*5.;bloom+=bright(uv0+vec2(d.x,0.));bloom+=bright(uv0-vec2(d.x,0.));bloom+=bright(uv0+vec2(0.,d.y));bloom+=bright(uv0-vec2(0.,d.y));bloom+=bright(uv0+d*1.7);bloom+=bright(uv0-d*1.7);bloom+=bright(uv0+vec2(d.x,-d.y)*1.7);bloom+=bright(uv0+vec2(-d.x,d.y)*1.7);c+=bloom*.034*glow;vec2 v=uv0-.5;c*=1.-dot(v,v)*.18;gl_FragColor=vec4(c,1.);\n#include <tonemapping_fragment>\n#include <colorspace_fragment>\n// \u0414\u0438\u0437\u0435\u0440\u0438\u043d\u0433 \u043d\u0430 \u0432\u044b\u0445\u043e\u0434\u0435: 8-\u0431\u0438\u0442\u043d\u044b\u0439 \u044d\u043a\u0440\u0430\u043d \u0431\u0435\u0437 \u043d\u0435\u0433\u043e \u043f\u043e\u043b\u043e\u0441\u0438\u0442 \u0442\u0451\u043c\u043d\u044b\u0435 \u0433\u0440\u0430\u0434\u0438\u0435\u043d\u0442\u044b \u043d\u0435\u0431\u0430 \u0438 \u043f\u044f\u0442\u0435\u043d \u0441\u0432\u0435\u0442\u0430. \u0421\u0432\u043e\u0439 \u0448\u0443\u043c, \u0430 \u043d\u0435\n// \u0447\u0430\u043d\u043a three: dithering_pars_fragment \u0437\u043e\u0432\u0451\u0442 rand() \u0438\u0437 <common>, \u043a\u043e\u0442\u043e\u0440\u043e\u0433\u043e \u0432 \u044d\u0442\u043e\u043c \u0448\u0435\u0439\u0434\u0435\u0440\u0435 \u043d\u0435\u0442, \u0438 \u043a\u0430\u0434\u0440 \u043d\u0435 \u0441\u043e\u0431\u0438\u0440\u0430\u043b\u0441\u044f.\ngl_FragColor.rgb+=(fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453)-.5)*(1./255.);\n}";
let before=false;$('post').onclick=()=>{before=!before;graphics.material.fragmentShader=before?beforeFragment:compositeFragment;graphics.material.needsUpdate=true;$('post').textContent='Постобработка: '+(before?'до':'после');};
function fail(e){$('status').textContent='Ошибка: '+e.message;console.error(e);}
addEventListener('resize',resize);await build();
function frame(t){requestAnimationFrame(frame);const dt=Math.min(.04,(t-last)/1000||.016);last=t;if(busy)return;
 if(moving){travel+=dt*18;for(const r of world.moving){r.obj.position.z=((r.start+travel+300)%r.span+r.span)%r.span-300;r.obj.visible=r.obj.position.z>-240&&r.obj.position.z<95;}world.update(travel);cars.forEach(c=>{c.speed=18;c.travelDistance=travel;c.time+=dt;});weather.update(dt,...cars,...models);}
 graphics.render(world.scene,camera);if(++frames%15===0)$('status').textContent=`${world.cfg.weather} · ${graphics.target.width}×${graphics.target.height} · ${renderer.info.render.calls} отрисовок · ${renderer.info.render.triangles.toLocaleString('ru')} треуг. · ошибок шейдеров: ${shaderErrors}. Тяни для вращения. Сейв игры не используется.`;
}requestAnimationFrame(frame);
</script></html>
