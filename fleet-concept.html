<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Макет: мои тачки</title>
<style>
@font-face{font-family:Oswald;src:url('assets/oswald.woff2') format('woff2');font-weight:400 700;font-display:swap}
:root{--ink:#e9dfc8;--gold:#eab45b;--green:#7fc47a}
*{box-sizing:border-box}
body{margin:0;padding:26px;background:#0e100f;color:var(--ink);font:400 14px Oswald,system-ui;display:flex;gap:26px;align-items:flex-start}
.phone{width:375px;height:812px;position:relative;overflow:hidden;border-radius:18px;background:#111413;
 display:flex;flex-direction:column;box-shadow:0 20px 60px #000a}
.phone>.cap{position:absolute;left:0;right:0;bottom:-26px;text-align:center;font:600 12px Oswald;letter-spacing:.1em;color:#8d8877}

/* Верхняя панель — как в игре */
.topbar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#0d100f;border-bottom:1px solid #ffffff10;flex:0 0 auto}
.topbar .chip{display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid #6b5a33;border-radius:5px;background:#1d1a12;font:600 14px Oswald;color:#f0dcae}
.topbar .res{margin-left:auto;display:flex;gap:12px;align-items:center;font:600 14px Oswald}
.topbar .res span{display:flex;align-items:center;gap:5px}
.topbar .x{width:32px;height:32px;display:grid;place-items:center;border:0;background:none;color:#cdc3ab;font-size:20px}

/* Заголовок экрана */
.head{padding:14px 16px 10px;flex:0 0 auto}
.head h1{margin:0;font:700 30px/1 Oswald;letter-spacing:.01em}
.head p{margin:5px 0 0;font:400 13px Oswald;color:#9d9583}

/* Витрина */
.hero{position:relative;flex:0 0 auto;height:204px;overflow:hidden;background:#0a0c0b}
.hero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(2px) brightness(.55) saturate(.8);transform:scale(1.08)}
.hero .fade{position:absolute;inset:0;background:linear-gradient(180deg,#0a0c0bd9,#0a0c0b26 30%,#0a0c0be6 76%,#0a0c0b 100%)}
.hero .car{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);width:72%;
 filter:drop-shadow(0 18px 26px #000c)}
.hero .text{position:absolute;left:16px;right:16px;bottom:10px}
.hero h2{margin:4px 0 0;font:700 32px/1 Oswald;letter-spacing:.01em;text-shadow:0 3px 14px #000}
.hero .specs{margin:6px 0 0;font:500 13px Oswald;color:#c9bfa7;display:flex;gap:10px;align-items:center}
.hero .specs b{color:var(--gold);font-weight:700}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px 4px;border-radius:4px;
 background:linear-gradient(#f3cd85,#dda43c);color:#2a2008;font:700 12px Oswald;letter-spacing:.08em;text-transform:uppercase;
 box-shadow:0 2px 0 #8a6529}
.badge.dim{background:#2a2e2b;color:#a49b86;box-shadow:none;border:1px solid #ffffff16}

/* Список */
.list{flex:1;min-height:0;overflow:auto;padding:9px 12px 8px;display:flex;flex-direction:column;gap:7px;scrollbar-width:none}
.row{display:grid;grid-template-columns:80px 1fr auto;align-items:center;gap:10px;padding:5px 11px 5px 6px;
 border:1px solid #ffffff12;border-radius:8px;background:#181c1a;text-align:left}
.row.on{border-color:var(--gold);background:#20201a;box-shadow:inset 0 0 0 1px #eab45b40}
.row img{width:80px;height:46px;object-fit:contain;filter:drop-shadow(0 4px 6px #000a)}
.row.locked img{filter:brightness(.35) saturate(.2)}
.row b{display:block;font:700 17px/1.1 Oswald}
.row small{display:block;margin-top:2px;font:400 12px Oswald;color:#9d9583}
.state{display:flex;align-items:center;gap:6px;font:600 13px Oswald;white-space:nowrap}
.state.own{color:var(--green)}
.state.sel{color:var(--gold)}
.state.lock{color:#8f8876}
.state.shards{color:#c9bfa7}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-size:11px}
.bar{grid-column:2/-1;height:4px;border-radius:2px;background:#ffffff14;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;background:var(--gold)}

/* Нижняя панель */
.bar-bottom{flex:0 0 auto;display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 12px 14px;background:#0d100f;border-top:1px solid #ffffff12}
.need{display:flex;align-items:center;gap:9px;padding:8px 12px;border:1px solid #ffffff14;border-radius:8px;background:#161a18;max-width:150px}
.need small{display:block;font:400 11px Oswald;color:#8f8876}
.need b{display:block;font:700 15px/1.1 Oswald;color:#d9cfb6}
.cta{border:0;border-radius:8px;padding:11px 12px;white-space:nowrap;background:linear-gradient(#f2c87d,#e0a63f);color:#241e15;
 font:700 18px Oswald;letter-spacing:.02em;box-shadow:0 4px 0 #8a6529;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.cta .line{display:flex;align-items:center;gap:8px}
.cta .prog{width:100%;height:4px;border-radius:2px;background:#00000030;overflow:hidden}
.cta .prog i{display:block;height:100%;background:#3f2f12}
.cta.ghost{background:#1d211f;color:#cdc3ab;box-shadow:0 3px 0 #0f1211;border:1px solid #ffffff16}
svg{display:block}
</style></head><body>

const gear=`<svg width="13" height="13" viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm10 4-2.1-1.2.5-2.4-2.3-.9-1.2-2.1-2.4.5L12 2l-1.7 1.9-2.4-.5L6.7 5.5l-2.3.9.5 2.4L2 12l2.9 1.2-.5 2.4 2.3.9 1.2 2.1 2.4-.5L12 22l1.7-1.9 2.4.5 1.2-2.1 2.3-.9-.5-2.4Z" fill="#e6eefb"/></svg>`;

const garageIcon=`<svg width="26" height="26" viewBox="0 0 24 24"><path d="M2 10 12 4l10 6v11h-3V12H5v9H2Zm5 5h10v2H7Zm0 4h10v2H7Z" fill="#a89a78"/></svg>`;

const CARS=[

 {id:'kopeyka',name:'КОПЕЙКА',  model:'ВАЗ-2101',  tag:'Тяга с низов',      power:104,gears:4,top:164},
 {id:'volga',  name:'ВОЛГА',    model:'ГАЗ-24',    tag:'Раскрывается вдаль',power:115,gears:4,top:196},
 {id:'twelve', name:'ДВЕНАШКА', model:'ВАЗ-2112',  tag:'Любит обороты',     power:119,gears:5,top:214},

];

const top=`<header class="topbar"><span class="chip">${garageIcon.replace(/26/g,'16')} ГАРАЖ I</span>

const hero=c=>`<section class="hero">
 <img class="bg" src="assets/garage-look.webp" alt="">
 <div class="fade"></div>
 <img class="car" src="assets/cars/${c.id}.webp" alt="">
 <div class="text"><span class="badge">${c.tag}</span>
  <h2>${c.name}</h2>
  <p class="specs"><span>${c.model}</span><span>${bolt} <b>${c.power}</b></span><span>${c.gears} ст.</span><span>${c.top} км/ч</span></p>
 </div></section>`;

const state=s=>{
 if(s.sel)return `<span class="state sel"><span class="dot">✓</span>ВЫБРАНА</span>`;
 if(s.own)return `<span class="state own"><span class="dot">✓</span>В ГАРАЖЕ</span>`;
 if(s.full)return `<span class="state lock">${lock} НУЖНО МЕСТО</span>`;
 if(s.have!==undefined)return `<span class="state shards">◆ ${s.have} / ${s.need}</span>`;
 return `<span class="state lock">${lock} ПОЗЖЕ</span>`;
};
const row=(c,s)=>`<button class="row ${s.sel?'on':''} ${s.own?'':'locked'}">
 <img src="assets/cars/${c.id}.webp" alt="">
 <span><b>${c.name}</b><small>${s.hint||c.model}</small></span>
 ${state(s)}
 ${s.have!==undefined&&!s.full?`<span class="bar"><i style="width:${Math.round(s.have/s.need*100)}%"></i></span>`:''}
</button>`;

 +hero(car)+`<div class="list">${rows.map(([c,s])=>row(c,s)).join('')}</div>`+bar+`<div class="cap">${cap}</div>`;

],`<div class="bar-bottom"><div class="need">${garageIcon}<span><small>Гараж</small><b>1 ИЗ 1</b></span></div>
